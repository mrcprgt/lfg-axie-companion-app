plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdk 31

    defaultConfig {
        applicationId "com.mrcprgt.lfgaxiecompanionapp"
        minSdk 21
        targetSdk 31
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
    }

    lintOptions {
        abortOnError false
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude "**/attach_hotspot_windows.dll"
        exclude "META-INF/licenses/**"
        exclude "META-INF/AL2.0"
        exclude "META-INF/LGPL2.1"
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/AL2.0'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude("META-INF/*.kotlin_module")
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'androidx.appcompat:appcompat:1.3.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'

    def room_version = "2.3.0"

    implementation("androidx.room:room-runtime:$room_version")
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // To use Kotlin annotation processing tool (kapt)
    kapt "androidx.room:room-compiler:$room_version"
    // optional - Kotlin Extensions and Coroutines support for Room
    implementation("androidx.room:room-ktx:$room_version")

    implementation 'joda-time:joda-time:2.10.2'

    //Dagger
    implementation("com.google.dagger:dagger-compiler:2.35")
    implementation 'com.google.dagger:dagger-android-support:2.24'
    kapt "com.google.dagger:dagger-android-processor:2.24"
    kapt "com.google.dagger:dagger-compiler:2.24"
    kapt("com.google.dagger:dagger-compiler:2.35")
    annotationProcessor("com.google.dagger:dagger-android-processor:2.27")

    implementation('androidx.viewpager2:viewpager2:1.0.0')

    //Coroutines
    implementation('org.jetbrains.kotlinx:kotlinx-coroutines-core:1.4.2-native-mt')
    implementation('org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.2-native-mt')
    implementation('javax.inject:javax.inject:1')
    implementation('org.jetbrains.kotlinx:kotlinx-coroutines-android:1.4.2-native-mt')
    implementation('org.jetbrains.kotlinx:kotlinx-coroutines-test:1.3.8')

    //Gson
    implementation('com.google.code.gson:gson:2.8.6')

    //FlexiAdapter
    implementation('eu.davidea:flexible-adapter:5.1.0')
    implementation('eu.davidea:flexible-adapter-ui:1.0.0')

    //Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.6.4'

    implementation 'com.squareup.retrofit2:converter-gson:2.6.4'

    def nav_version = "2.3.5"

    // Kotlin
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
}